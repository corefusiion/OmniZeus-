      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94A3B8">Zero Cold Start &lt; 15ms</text>
      <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#10B981">Cloudflare Pages Build</text>
