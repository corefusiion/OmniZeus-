    <rect width="210" height="36" rx="12" fill="#1E6FD9" fill-opacity="0.25"/>
    <rect y="24" width="210" height="12" fill="#1E6FD9" fill-opacity="0.25"/>
    <text x="16" y="24" font-family="monospace" font-size="11" font-weight="700" fill="#38BDF8">02. EDGE &amp; SEGURANÇA</text>

    <g transform="translate(14, 52)">
