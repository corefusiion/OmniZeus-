<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520">
  <defs>
    <!-- Background & Gradients -->
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D18"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="blueBoxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E6FD9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <pattern id="archGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect width="1100" height="520" fill="url(#archBg)"/>
  <rect width="1100" height="520" fill="url(#archGrid)"/>

  <!-- Title & Legend -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="800" fill="#FFFFFF">
      OMNIZEUS — Arquitetura de Alto Nível &amp; Isolamento Multi-Tenant
    </text>
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="12" font-weight="400" fill="#94A3B8">
      Fluxo de requisição com Edge Runtime, barreiras estritas de tenant, gateway de IA e sincronização ERP.
    </text>
  </g>

  <!-- 1. CLIENT LAYER -->
  <g transform="translate(60, 100)" filter="url(#boxShadow)">
    <rect width="210" height="360" rx="12" fill="url(#blueBoxGrad)" stroke="#334155" stroke-width="1.2"/>
    <rect width="210" height="36" rx="12" fill="#1E293B"/>
    <rect y="24" width="210" height="12" fill="#1E293B"/>
    <text x="16" y="24" font-family="monospace" font-size="11" font-weight="700" fill="#38BDF8">01. CAMADA CLIENTE</text>

    <!-- Sub items -->
    <g transform="translate(14, 52)">
      <!-- Item 1 -->
      <rect width="182" height="64" rx="8" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Web SPA (Next.js 14)</text>
      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94A3B8">App Router &amp; Edge Components</text>
      <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#10B981">Tailwind + Lucide + SWR</text>
    </g>

    <g transform="translate(14, 126)">
      <!-- Item 2 -->
      <rect width="182" height="64" rx="8" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Mobile Responsive</text>
      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94A3B8">Calculadora ROI &amp; Painéis</text>
      <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#38BDF8">Viewports 320px – 4K</text>
    </g>

    <g transform="translate(14, 200)">
      <!-- Item 3 -->
      <rect width="182" height="64" rx="8" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Tenant Context</text>
      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94A3B8">useTenant() &amp; Company Switcher</text>
      <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#F59E0B">SaaS Master vs Tenant</text>
    </g>

    <g transform="translate(14, 274)">
