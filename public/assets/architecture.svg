      <rect width="182" height="64" rx="8" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Permissão por Módulo</text>
      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94A3B8">allowedModules Filtering</text>
