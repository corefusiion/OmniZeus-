      <rect width="182" height="64" rx="8" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Economia OmniCoins</text>
      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94A3B8">1 Coin = R$ 0,10 (FinOps)</text>
      <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#38BDF8">Dedução atômica por tenant</text>
    </g>

    <g transform="translate(14, 200)">
      <rect width="182" height="64" rx="8" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Motor Sync Conta Azul</text>
      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94A3B8">Auto-Sync Otimizado Edge</text>
      <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#10B981">&lt; 12 subrequests per call</text>
    </g>

    <g transform="translate(14, 274)">
      <rect width="182" height="64" rx="8" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">IA BPO &amp; Docs Engine</text>
      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94A3B8">Conciliação, PDF A4, .pptx</text>
      <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#F59E0B">Vision OCR de Faturas</text>
    </g>
  </g>

  <!-- Connect Arrow 3 -> 4 -->
  <g transform="translate(825, 275)">
    <line x1="0" y1="0" x2="45" y2="0" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="45,-5 55,0 45,5" fill="#38BDF8"/>
  </g>

