      <text x="10" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">OpenRouter API</text>
      <text x="10" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94A3B8">Unified LLM Gateway</text>
      <text x="10" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="600" fill="#38BDF8">Chave Master / Tenant</text>
    </g>

    <g transform="translate(12, 126)">
      <rect width="146" height="64" rx="8" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
      <text x="10" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Conta Azul ERP</text>
      <text x="10" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94A3B8">OAuth 2.0 API v2</text>
      <text x="10" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="600" fill="#10B981">Clientes / DRE / Extratos</text>
    </g>

    <g transform="translate(12, 200)">
      <rect width="146" height="64" rx="8" fill="#0F172A" stroke="#334155" stroke-width="0.8"/>
      <text x="10" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Stripe Subscriptions</text>
      <text x="10" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94A3B8">Billing &amp; Portal</text>
      <text x="10" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="600" fill="#F59E0B">HMAC Webhook Check</text>
    </g>

    <g transform="translate(12, 274)">
      <rect width="146" height="64" rx="8" fill="#0F172A" stroke="#1E6FD9" stroke-width="1"/>
      <text x="10" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Supabase DB</text>
      <text x="10" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" fill="#94A3B8">PostgreSQL + RLS</text>
      <text x="10" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#10B981">AES-256 GCM Rest</text>
    </g>
