      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Evolution WhatsApp</text>
      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94A3B8">Chatbot &amp; Avisos Financeiros</text>
      <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#10B981">Webhooks 2-Way</text>
    </g>
