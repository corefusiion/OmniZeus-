      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">JWT HttpOnly Cookie</text>
      <text x="12" y="36" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" fill="#94A3B8">PBKDF2 Web Crypto Session</text>
      <text x="12" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#38BDF8">Anti-Tamper Signature</text>
